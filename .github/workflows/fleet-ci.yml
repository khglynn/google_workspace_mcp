# Fleet ops: the trustworthy gate (dependency-security guide: prod-reachable +
# High threshold + no continue-on-error on blocking jobs; a noisy gate trains
# everyone to ignore it, so informational checks are separated and non-blocking).
name: fleet-ci
on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` are NOT in the default type set
    # ([opened, synchronize, reopened]), and the aging gate below keys off the
    # `fleet-sync` label. Without them, a PR labelled after it was opened is
    # evaluated against an empty labels array, concludes "not a sync PR", and
    # passes without ever checking the window. Re-running does not help: a
    # re-run replays the original event payload, labels and all.
    # (Found 2026-08-02 on the v1.23.0 sync, PR #11.)
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Frozen install (Shai-Hulud defense — exact locked versions only)
        run: uv sync --frozen
      - name: Tests
        # --deselect: upstream shipped v1.22.0 with this one test broken
        # (updateMask changed by their #862 forms fix, test not updated;
        # verified failing on pristine v1.22.0 baseline 2026-07-09).
        # Config-level workaround, no code divergence. Drop the deselect when
        # an upstream release fixes it; report upstream meanwhile.
        run: >-
          uv run pytest -q
          --deselect tests/gforms/test_forms_tools.py::test_set_publish_settings_builds_publish_state_body

  # Direct checksum-pinned binary — the official action is a reusable workflow
  # whose INTERNALS use tag-pinned actions, which our repo-level SHA-pinning
  # requirement (correctly) blocks. Binary = full control of the supply chain.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: OSV scan of uv.lock (BLOCKING)
        run: |
          curl -sSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v2.4.0/osv-scanner_linux_amd64"
          echo "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner --lockfile=uv.lock

  uv-audit-informational:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: uv audit (INFORMATIONAL while preview)
        continue-on-error: true
        run: uv audit || true

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t workspace-mcp:pr .
      - name: Trivy (HIGH/CRITICAL, fixed-only, BLOCKING)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: workspace-mcp:pr
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: zizmor (workflow injection / unpinned-uses lint)
        # scope to OUR workflows — upstream's tag-pinned files are their call
        # and flagging them every PR is the noise that kills gate trust
        run: uvx zizmor .github/workflows/fleet-*.yml

  aging-window:
    # Sync PRs must age 7 days before merge (supply-chain hedge). The clock runs
    # from the UPSTREAM RELEASE's publish date — the quantity the policy is
    # actually about — recovered from the `sync/<tag>` branch name. Fast lane:
    # `security-override` label. Non-sync PRs pass immediately.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Enforce 7-day aging on fleet-sync PRs
        env:
          GH_TOKEN: ${{ github.token }}
          # event data via env, never inline in the script (injection hygiene)
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          CREATED: ${{ github.event.pull_request.created_at }}
          # attacker-controllable on a fork PR — validated against a strict tag
          # pattern below before it reaches any command
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          UPSTREAM: taylorwilsdon/google_workspace_mcp
        run: |
          echo "$LABELS" | grep -q 'fleet-sync' || { echo "not a sync PR — pass"; exit 0; }
          echo "$LABELS" | grep -q 'security-override' && { echo "security-override — fast lane"; exit 0; }

          # Clock source: the upstream release's publish date. Falls back to the
          # PR's created_at when the tag cannot be resolved (unconventional
          # branch name, release not found, API trouble). The fallback is never
          # more permissive — a sync PR is opened after the release exists, so
          # created_at >= published_at — so a lookup failure can only delay a
          # merge, never wave one through early.
          tag="${HEAD_REF#sync/}"
          published=""
          if [ "$tag" != "$HEAD_REF" ] && printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            published=$(gh release view "$tag" -R "$UPSTREAM" --json publishedAt -q .publishedAt 2>/dev/null || true)
          fi

          if [ -n "$published" ]; then
            clock="$published"
            echo "clock: upstream $tag published $published"
          else
            clock="$CREATED"
            echo "clock: PR created_at $CREATED (upstream tag unresolved — conservative fallback)"
          fi

          age_days=$(( ( $(date -u +%s) - $(date -u -d "$clock" +%s) ) / 86400 ))
          echo "age: ${age_days}d (need 7)"
          [ "$age_days" -ge 7 ] || { echo "❌ aging window not met — merge on or after $(date -u -d "$clock +7 days" +%Y-%m-%d)"; exit 1; }
