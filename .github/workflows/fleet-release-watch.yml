# Fleet ops: watch upstream RELEASES (not commits) and open an intake PR.
# Design (2026-07-08 fleet plan): tag-based intake → sync branch → PR carrying
# release notes + diff stat + a 7-day aging window (supply-chain hedge; the
# `security-override` label is the KEV/EPSS fast lane, enforced by fleet-ci).
#
# Conflict handling (added 2026-07-27, after v1.22.2 intake died silently):
# a conflicting merge used to `exit 1` mid-step, which made GitHub SKIP the
# Slack step — so the one outcome that NEEDS a human produced no notification
# at all, only a red X in a tab nobody watches. Silence must never mean
# "nothing to do." Now a conflict files an idempotent issue carrying the
# conflicting-file list plus a copy-paste resolution recipe, and notifies.
#
# Issue-tracker independence (2026-08-02, after v1.23.0 intake failed twice):
# this fork has issues DISABLED, and `gh issue list` hard-errors on such a
# repo. Under `set -e` that killed the step before it could record an outcome,
# so a routine uv.lock conflict was reported to Slack as "FAILED unexpectedly"
# — the 2026-07-27 hardening reintroduced its own failure mode one layer up.
# The issue is now a nice-to-have: the conflict path probes for a tracker,
# treats filing as best-effort, and carries the conflicting-file list in the
# Slack message so the notification never depends on the issues API at all.
name: fleet-release-watch
on:
  schedule:
    - cron: "20 20 * * *" # daily, ~3:20pm CT — Kevin's anchor window (2026-07-27: non-critical pings cluster ~3pm CT; only real alarms go off-hours)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          # FLEET_PAT so the pushed sync branch + PR trigger fleet-ci
          # (GITHUB_TOKEN-authored events deliberately do not trigger workflows)
          token: ${{ secrets.FLEET_PAT || github.token }}
      - name: Compare upstream latest release to our main
        id: cmp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # tag name is third-party input — sanitize to a safe charset at the source
          latest=$(gh api repos/taylorwilsdon/google_workspace_mcp/releases/latest -q .tag_name | tr -cd 'A-Za-z0-9._-')
          current="v$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')"
          echo "latest=$latest current=$current"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then echo "behind=false" >> "$GITHUB_OUTPUT"; else echo "behind=true" >> "$GITHUB_OUTPUT"; fi
      - name: Open sync PR if behind (idempotent; files an issue on conflict)
        id: intake
        if: steps.cmp.outputs.behind == 'true'
        env:
          GH_TOKEN: ${{ secrets.FLEET_PAT || github.token }}
          LATEST: ${{ steps.cmp.outputs.latest }}
        run: |
          set -euo pipefail
          # `outcome` is the single source of truth for the notify step. It is
          # deliberately NOT pre-seeded: an unset value means this step died
          # before reaching any known branch, which the notify step reports as
          # a red unexpected-failure rather than swallowing.
          if gh pr list --repo "$GITHUB_REPOSITORY" --head "sync/$LATEST" --state open --json number -q length | grep -qv '^0$'; then
            echo "sync PR for $LATEST already open"
            echo "outcome=pr-already-open" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "fleet-release-watch"
          git config user.email "noreply@github.com"
          git remote add upstream https://github.com/taylorwilsdon/google_workspace_mcp.git 2>/dev/null || true
          git fetch upstream --tags --quiet
          git checkout -b "sync/$LATEST"

          # --- the conflict fork -------------------------------------------
          if ! git merge --no-edit "$LATEST"; then
            conflicts=$(git diff --name-only --diff-filter=U)
            git merge --abort || true
            echo "merge conflicts in: $conflicts"
            # Handed to the notify step so Slack names the files even when no
            # issue gets filed. tr+sed rather than `paste -sd', '`, because
            # paste CYCLES a multi-char delimiter list: three files would come
            # out as "a,b c" instead of "a, b, c".
            echo "conflicts=$(printf '%s' "$conflicts" | tr '\n' ',' | sed 's/,$//; s/,/, /g')" >> "$GITHUB_OUTPUT"

            # An issue tracker is not guaranteed. Forks ship with issues
            # DISABLED (this one is), and `gh issue list` hard-errors there
            # rather than returning empty — which under `set -e` used to kill
            # the step before any outcome was recorded. Probe first; the
            # notification is what matters, the issue is the nicety.
            if [ "$(gh repo view "$GITHUB_REPOSITORY" --json hasIssuesEnabled -q .hasIssuesEnabled)" != "true" ]; then
              echo "issues disabled on $GITHUB_REPOSITORY — notifying via Slack only"
              echo "outcome=conflict-no-tracker" >> "$GITHUB_OUTPUT"; exit 0
            fi

            # idempotent: one open issue per tag, never a daily duplicate.
            # Exact title match, not --search: search is fuzzy and would let a
            # near-miss re-file the same issue every morning (noise kills trust).
            existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label fleet-sync \
              --json title \
              -q "[.[] | select(.title == \"sync: upstream $LATEST needs manual conflict resolution\")] | length" || echo 0)
            if [ "${existing:-0}" != "0" ]; then
              echo "conflict issue for $LATEST already open"
              echo "outcome=conflict-already-filed" >> "$GITHUB_OUTPUT"; exit 0
            fi

            # Best-effort: a tracker that rejects the write (label removed, API
            # trouble) must degrade to a Slack ping, never to a dead step.
            if ! gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "sync: upstream $LATEST needs manual conflict resolution" \
              --label fleet-sync \
              --body "$(printf 'Automated intake of upstream **%s** hit merge conflicts, so the sync PR was NOT opened. The merge was aborted cleanly — nothing was pushed.\n\n**Conflicting files:**\n```\n%s\n```\n\n**Resolve locally** (from the `google-souped-up-mcp` checkout):\n```\ngit fetch origin && git checkout main && git pull --ff-only\ngit fetch upstream --tags\ngit checkout -b sync/%s\ngit merge %s\n# resolve the files above, keeping BOTH the fork customizations and upstream changes\n# (uv.lock: never hand-merge — git can pair the version line from one side with the hashes from the other, which yields a lockfile that looks resolved and is not. Take one side whole, then regenerate: git checkout --theirs uv.lock && uv lock)\ngit add -A && git commit\ngit push -u origin sync/%s\ngh pr create --base main --head sync/%s --label fleet-sync --title "sync: upstream %s"\n```\n\nThe usual fork customizations that cause conflicts live in `Dockerfile` (Trivy CVE pins, `--extra valkey`) and `uv.lock`. Check whether upstream converged on the same change before assuming a real conflict.\n\nAfter merging, **redeploy the fleet** — merging here does not update Cloud Run: `deploy/deploy-personal.sh --account <trimm|kevnhg|kkevinhg|chryslerbend>`.\n\n_Filed automatically by fleet-release-watch. Closing this issue does not resolve the drift; the watcher will re-file if the sync is still pending._' \
                "$LATEST" "$conflicts" "$LATEST" "$LATEST" "$LATEST" "$LATEST" "$LATEST")"; then
              echo "issue filing failed — falling back to a Slack-only notification"
              echo "outcome=conflict-no-tracker" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "outcome=conflict-issue-filed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --- clean merge: the normal path --------------------------------
          git push origin "sync/$LATEST"
          notes=$(gh api "repos/taylorwilsdon/google_workspace_mcp/releases/tags/$LATEST" -q .body | head -c 4000)
          stat=$(git diff --stat "origin/main..HEAD" | tail -5)
          agents=$(git diff --name-only "origin/main..HEAD" | grep -E '^(skills/|.*SKILL\.md|.*\.claude)' || echo "(none)")
          not_before=$(date -u -d "+7 days" +%Y-%m-%d)
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "sync/$LATEST" \
            --title "sync: upstream $LATEST" \
            --label fleet-sync \
            --body "$(printf 'Upstream release intake: **%s**\n\n**Aging window:** do not merge before **%s** (7-day supply-chain hedge; label `security-override` + cite the CVE for the fast lane).\n\n**Agent-facing files changed (review as a security surface):**\n```\n%s\n```\n\n**Diff stat (tail):**\n```\n%s\n```\n\n**Upstream release notes:**\n\n%s' "$LATEST" "$not_before" "$agents" "$stat" "$notes")"
          echo "outcome=pr-opened" >> "$GITHUB_OUTPUT"
      - name: Notify Slack
        # always() so this reports the conflict path AND any unexpected crash
        # in the step above — the whole point of the 2026-07-27 hardening is
        # that a failure must never be silent.
        if: always() && steps.cmp.outputs.behind == 'true'
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          LATEST: ${{ steps.cmp.outputs.latest }}
          OUTCOME: ${{ steps.intake.outputs.outcome }}
          CONFLICTS: ${{ steps.intake.outputs.conflicts }}
          INTAKE_RESULT: ${{ steps.intake.outcome }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$WEBHOOK" ] && { echo "no webhook configured; skipping"; exit 0; }
          case "${OUTCOME:-}" in
            pr-opened)             text="📦 workspace-mcp: upstream $LATEST intake PR opened (7-day aging) → https://github.com/$REPO/pulls";;
            conflict-issue-filed)  text="⚠️ workspace-mcp: upstream $LATEST intake hit MERGE CONFLICTS in ${CONFLICTS:-?} — issue filed with a resolution recipe → https://github.com/$REPO/issues";;
            conflict-already-filed) text="⏳ workspace-mcp: upstream $LATEST still awaiting manual conflict resolution → https://github.com/$REPO/issues";;
            # No issue tracker on this repo, so Slack IS the work item: carry the
            # file list and the recipe pointer inline rather than linking nowhere.
            conflict-no-tracker)   text="⚠️ workspace-mcp: upstream $LATEST intake hit MERGE CONFLICTS in ${CONFLICTS:-?} — needs a manual sync branch (issues are disabled here, so no ticket was filed). Recipe: .github/workflows/fleet-release-watch.yml · run: $RUN_URL";;
            pr-already-open)       text="⏳ workspace-mcp: upstream $LATEST sync PR still open → https://github.com/$REPO/pulls";;
            *)                     text="🔴 workspace-mcp: upstream $LATEST intake FAILED unexpectedly (step result: ${INTAKE_RESULT:-unknown}) — check the run: $RUN_URL";;
          esac
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "$(printf '{"text":%s}' "$(printf '%s' "$text" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")" "$WEBHOOK"
